<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Burger Falcone</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <div id="loginScreen" class="login-screen" hidden>
    <div class="login-card">
      <div class="login-brand"><span>BF</span><h1>Burger Falcone</h1><p>Painel Administrativo</p></div>
      <form id="loginForm" class="login-form">
        <div class="field"><label for="loginEmail">E-mail</label><input id="loginEmail" type="email" required placeholder="admin@burgerfalcone.com" /></div>
        <div class="field"><label for="loginPassword">Senha</label><input id="loginPassword" type="password" required placeholder="••••••••" /></div>
        <button type="submit" class="btn btn--primary btn--block">Entrar</button>
        <p id="loginError" class="login-error" hidden></p>
      </form>
    </div>
  </div>

  <div id="appShell" class="app-shell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand"><span class="sidebar__logo">BF</span><div><strong>Burger Falcone</strong><small>Admin Panel</small></div></div>
      <nav class="sidebar__nav" id="sidebarNav"></nav>
      <div class="sidebar__footer"><button class="sidebar__logout" id="logoutBtn" type="button"><i data-lucide="log-out"></i> Sair</button></div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <button class="icon-btn mobile-menu" id="menuToggle" type="button" aria-label="Menu"><i data-lucide="menu"></i></button>
        <div class="topbar__title"><h1 id="pageTitle">Dashboard</h1><p id="pageSubtitle">Visão geral do restaurante</p></div>
        <div class="topbar__actions">
          <button class="store-toggle" id="storeToggle" type="button"><span class="store-toggle__dot"></span><span id="storeToggleLabel">Aberto</span></button>
          <button class="icon-btn notif-btn" id="notifBtn" type="button" aria-label="Notificações"><i data-lucide="bell"></i><span class="notif-badge" id="notifBadge" hidden>0</span></button>
          <div class="user-chip" id="userChip">Admin</div>
        </div>
      </header>
      <main class="main-content" id="mainContent"></main>
    </div>

    <nav class="bottom-nav" id="bottomNav"></nav>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>
  <div class="modal-root" id="modalRoot"></div>
  <audio id="orderSound" preload="auto"><source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBTGH0fPTgjMGHm7A7+OZURE=" type="audio/wav" /></audio>

  <script type="module" src="js/app.js"></script>
</body>
</html>
